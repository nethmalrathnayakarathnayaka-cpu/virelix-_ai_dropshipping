<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VIRELIX.AI | Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --neon: #00ffa3; --bg: #050508; --panel: #0f0f1a; --text: #ffffff; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; }

        /* Sidebar Navigation */
        .sidebar { width: 260px; height: 100vh; background: var(--panel); border-right: 1px solid rgba(255,255,255,0.05); padding: 20px; position: fixed; }
        .nav-item { padding: 15px; border-radius: 12px; cursor: pointer; color: #888; display: flex; align-items: center; gap: 15px; transition: 0.3s; margin-bottom: 5px; }
        .nav-item:hover, .nav-item.active { background: rgba(0,255,163,0.05); color: var(--neon); }

        /* Main Content Area */
        .main-content { margin-left: 300px; padding: 40px; width: calc(100% - 340px); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        
        /* Stats Cards */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px; }
        .card { background: var(--panel); padding: 25px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.03); }
        .card h2 { margin: 10px 0; color: var(--neon); font-size: 28px; }

        /* Control Button */
        .btn-action { background: var(--neon); color: #000; border: none; padding: 12px 25px; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="sidebar">
    <!-- Shopify Style Logo we created -->
    <div style="text-align:center; margin-bottom: 40px;">
        <div style="font-size: 24px; font-weight: 900;">virelix<span style="color:var(--neon)">.ai</span></div>
        <small style="color:#555">Owner: Nethmal Rathnayaka</small>
    </div>
    
    <div class="nav-item active"><i class="fa fa-home"></i> Overview</div>
    <div class="nav-item"><i class="fa fa-robot"></i> Auto-Pilot</div>
    <div class="nav-item"><i class="fa fa-shopping-cart"></i> Orders</div>
    <div class="nav-item"><i class="fa fa-chart-bar"></i> Analytics</div>
    <div class="nav-item"><i class="fa fa-cog"></i> Settings</div>
</div>

<div class="main-content">
    <div class="header">
        <h1>Master Control Dashboard</h1>
        <button class="btn-action" onclick="alert('Auto-Pilot Online')">RUN AUTO-FULFILLMENT</button>
    </div>

    <div class="stats-grid">
        <div class="card">
            <small>Total Sales</small>
            <h2>LKR 45,200</h2>
        </div>
        <div class="card">
            <small>Active Orders</small>
            <h2>12</h2>
        </div>
        <div class="card" style="border-color: var(--neon);">
            <small>Today's Profit</small>
            <h2>LKR 18,400</h2>
        </div>
    </div>

    <!-- Order Table Section -->
    <div class="card">
        <h3>Recent Orders</h3>
        <table style="width: 100%; border-collapse: collapse; margin-top: 20px;">
            <tr style="color: #555; font-size: 12px; text-align: left;">
                <th style="padding: 10px;">ORDER ID</th>
                <th>CUSTOMER</th>
                <th>STATUS</th>
                <th>ACTION</th>
            </tr>
            <tr style="border-top: 1px solid rgba(255,255,255,0.05);">
                <td style="padding: 15px;">#ORD-7721</td>
                <td>Sahan Perera</td>
                <td style="color: var(--neon);">Processing</td>
                <td><button style="background:none; border: 1px solid #333; color:#fff; padding:5px 10px; border-radius:5px; cursor:pointer;">View</button></td>
            </tr>
        </table>
    </div>
</div>

</body>
</html>
