<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Your Order - VIRELIX.AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --neon-green: #00ffa3;
            --bg-dark: #050508;
            --panel-bg: #0f0f1a;
        }

        body { font-family: 'Inter', sans-serif; background: var(--bg-dark); color: white; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

        .tracking-container { width: 90%; max-width: 600px; background: var(--panel-bg); padding: 40px; border-radius: 25px; border: 1px solid rgba(255,255,255,0.05); text-align: center; }

        .search-box { display: flex; gap: 10px; margin: 30px 0; }
        .search-box input { flex-grow: 1; padding: 15px; border-radius: 12px; border: 1px solid #333; background: #1a1a2e; color: white; outline: none; }
        .btn-track { background: var(--neon-green); color: black; border: none; padding: 15px 25px; border-radius: 12px; font-weight: bold; cursor: pointer; }

        /* Tracking Timeline */
        .timeline { margin-top: 40px; text-align: left; position: relative; padding-left: 50px; display: none; }
        .timeline::before { content: ''; position: absolute; left: 20px; top: 0; width: 2px; height: 100%; background: #333; }

        .step { position: relative; margin-bottom: 30px; }
        .step::before { content: '\f00c'; font-family: 'Font Awesome 5 Free'; font-weight: 900; position: absolute; left: -42px; top: 0; width: 25px; height: 25px; background: #333; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #555; }
        
        .step.active::before { background: var(--neon-green); color: black; }
        .step.active .step-title { color: var(--neon-green); }

        .step-title { font-weight: bold; display: block; margin-bottom: 5px; }
        .step-desc { font-size: 13px; color: #888; }
    </style>
</head>
<body>

<div class="tracking-container">
    <div class="virelix-text" style="font-size: 28px; font-weight: 800; margin-bottom: 10px;">virelix<span style="color:var(--neon-green)">.ai</span></div>
    <p style="color: #666;">ඇණවුමේ තොරතුරු දැනගැනීමට Order ID එක ඇතුළත් කරන්න.</p>

    <div class="search-box">
        <input type="text" id="orderID" placeholder="Order ID (e.g. #ORD-7721)">
        <button class="btn-track" onclick="trackOrder()">TRACK</button>
    </div>

    <div class="timeline" id="trackingResult">
        <div class="step active">
            <span class="step-title">Order Confirmed</span>
            <span class="step-desc">අපි ඔබේ ඇණවුම සාර්ථකව භාරගත්තා.</span>
        </div>
        <div class="step active">
            <span class="step-title">Processing at NMX Hub</span>
            <span class="step-desc">භාණ්ඩය පරික්ෂා කර ස්ටෝර් එකෙන් පිටත් කිරීමට සූදානම් වේ.</span>
        </div>
        <div class="step">
            <span class="step-title">Shipped (On the Way)</span>
            <span class="step-desc">ඇණවුම දැන් බෙදාහැරීමේ නියෝජිතයා වෙත භාර දී ඇත.</span>
        </div>
        <div class="step">
            <span class="step-title">Delivered</span>
            <span class="step-desc">භාණ්ඩය සාර්ථකව ඔබ වෙත ලැබී ඇත.</span>
        </div>
    </div>
</div>

<script>
    function trackOrder() {
        const id = document.getElementById('orderID').value;
        if(id.trim() === "") {
            alert("කරුණාකර නිවැරදි Order ID එකක් ඇතුළත් කරන්න.");
            return;
        }
        // Result එක පෙන්වීම
        document.getElementById('trackingResult').style.display = 'block';
    }
</script>

</body>
</html>
