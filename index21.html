<div class="product-container">
    <!-- වම්පස: පින්තූරය -->
    <div class="product-gallery">
        <img src="https://ae01.alicdn.com/kf/S7b7...jpg" id="main-img" alt="Product Image">
        <div class="thumbnails">
            <img src="thumb1.jpg" onclick="changeImg(this.src)">
            <img src="thumb2.jpg" onclick="changeImg(this.src)">
        </div>
    </div>

        <div class="price-tag">
            <span class="currency">LKR</span>
            <span class="amount">5,631.35</span>

        </div>

        <div class="inventory-status">
            <i class="fa fa-check-circle"></i> 100K+ items sold in AliExpress

                <div class="color-box active" style="background: #e0f2f1;"></div>

            </div>
        </div>

        <div class="action-buttons">

            <button class="btn-edit">EDIT DETAILS</button>
        </div>
    </div>
</div>
