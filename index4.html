<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIRELIX OS - Future of Dropshipping</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #00e5ff;
            --secondary: #9d00ff;
            --bg-dark: #050508;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg-dark); 
            color: #fff; 
            margin: 0; 
            overflow-x: hidden; 
        }

        /* Modern Sidebar Navigation */
        nav {
            position: fixed;
            left: 0; top: 0; height: 100vh;
            width: 80px;
            background: rgba(10, 10, 15, 0.8);
            backdrop-filter: blur(10px);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 30px;
            z-index: 1000;
            transition: 0.3s;
        }

        nav:hover { width: 200px; }

        nav a {
            color: #888;
            padding: 20px;
            text-decoration: none;
            font-size: 20px;
            width: 100%;
            text-align: center;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        nav a span { display: none; margin-left: 10px; font-size: 14px; }
        nav:hover a span { display: block; }
        nav a:hover { color: var(--primary); background: var(--glass); }

        /* Main Content Area */
        main { margin-left: 80px; padding: 40px; }

        /* Shopify Style Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--glass);
            padding: 25px;
            border-radius: 20px;
            border: 1px solid var(--border);
            text-align: left;
        }

        .stat-card h3 { font-size: 12px; color: #888; text-transform: uppercase; margin: 0; }
        .stat-card p { font-size: 24px; font-weight: bold; margin: 10px 0 0 0; color: var(--primary); }

        /* AI Video Studio Section */
        .studio-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            background: var(--glass);
            padding: 40px;
            border-radius: 30px;
            border: 1px solid var(--border);
        }

        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #aaa; font-size: 14px; }
        
        input, select, textarea {
            width: 100%;
            padding: 15px;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: white;
            outline: none;
        }

        .btn-glow {
            background: linear-gradient(45deg, var(--secondary), var(--primary));
            border: none;
            padding: 18px;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);
            transition: 0.3s;
        }

        .btn-glow:hover { transform: scale(1.02); box-shadow: 0 0 30px rgba(0, 229, 255, 0.4); }

        /* Video Preview Area */
        .preview-box {
            background: #000;
            border-radius: 20px;
            border: 2px dashed #333;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        #ai-video { width: 100%; height: 100%; object-fit: cover; display: none; }
        
        .loader-wrap { text-align: center; display: none; }
        .pulse {
            width: 60px; height: 60px;
            background: var(--primary);
            border-radius: 50%;
            animation: pulse-animation 1.5s infinite;
        }

        @keyframes pulse-animation {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 229, 255, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 20px rgba(0, 229, 255, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 229, 255, 0); }
        }

    </style>
</head>
<body>

<nav>
    <a href="#"><i class="fa fa-th-large"></i><span>Dashboard</span></a>
    <a href="#"><i class="fa fa-shopping-bag"></i><span>Products</span></a>
    <a href="#"><i class="fa fa-video"></i><span>AI Studio</span></a>
    <a href="#"><i class="fa fa-chart-line"></i><span>Analytics</span></a>
    <a href="#"><i class="fa fa-cog"></i><span>Settings</span></a>
</nav>

<main>
    <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px;">
        <h1>Welcome, Nethmal Rathnayaka</h1>
        <div style="background: var(--glass); padding: 10px 20px; border-radius: 50px; border: 1px solid var(--border);">
            <i class="fa fa-circle" style="color: #00ff88; font-size: 10px;"></i> System Live
        </div>
    </header>

    <!-- Analytics Section -->
    <div class="stats-grid">
        <div class="stat-card"><h3>Total Sales</h3><p>$4,250.00</p></div>
        <div class="stat-card"><h3>AI Videos Made</h3><p>128</p></div>
        <div class="stat-card"><h3>Active Store</h3><p>TRENDLINE</p></div>
        <div class="stat-card"><h3>Conversion</h3><p>12.5%</p></div>
    </div>

    <!-- AI Video Generator Section -->
    <div class="studio-container">
        <div class="controls">
            <h2 style="margin-top: 0;">AI Video Lab v2.0</h2>
            
            <div class="input-group">
                <label>Product Image Source</label>
                <input type="file" id="imageInput">
            </div>

            <div class="input-group">
                <label>Target Audience Prompt</label>
                <textarea id="promptInput" rows="4" placeholder="Describe how the AI character should present the product..."></textarea>
            </div>

            <div class="input-group">
                <label>Select Avatar Concept</label>
                <select id="avatarType">
                    <option value="luxury">Luxury Lifestyle (Girl)</option>
                    <option value="tech">Tech Enthusiast (Boy)</option>
                    <option value="minimalist">Minimalist (Aesthetic)</option>
                </select>
            </div>

            <button class="btn-glow" onclick="processAI()">GENERATE AI EXPERIENCE</button>
        </div>

        <div class="preview-box" id="displayBox">
            <div class="loader-wrap" id="loader">
                <div class="pulse"></div>
                <p style="margin-top: 20px; color: var(--primary);">Engaging AI Neural Engines...</p>
            </div>
            <p id="placeholderText" style="color: #444;">Video Preview will appear here</p>
            <video id="ai-video" controls>
                <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
            </video>
        </div>
    </div>
</main>

<script>
    function processAI() {
        const prompt = document.getElementById('promptInput').value;
        if(!prompt) return alert("Please enter a prompt for the AI.");

        document.getElementById('placeholderText').style.display = "none";
        document.getElementById('ai-video').style.display = "none";
        document.getElementById('loader').style.display = "block";

        // Shopify Style Processing Simulation
        setTimeout(() => {
            document.getElementById('loader').style.display = "none";
            const video = document.getElementById('ai-video');
            video.style.display = "block";
            video.play();
            alert("AI Video Generated Successfully for TRENDLINE Store!");
        }, 5000);
    }
</script>

</body>
</html>
