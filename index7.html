<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIRELIX - Create Your Premium Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #00e5ff;
            --accent: #9d00ff;
            --bg: #030305;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: white; margin: 0; }

        /* Navigation */
        nav { padding: 20px 50px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); backdrop-filter: blur(10px); sticky: top; }
        .logo { font-size: 24px; font-weight: 800; background: linear-gradient(to right, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .container { max-width: 1200px; margin: auto; padding: 50px 20px; }

        /* Store Creator UI */
        .creator-grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 50px; }
        
        .setup-box { background: var(--card-bg); padding: 40px; border-radius: 30px; border: 1px solid var(--border); box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        
        h2 { font-size: 32px; margin-bottom: 10px; }
        p.subtitle { color: #888; margin-bottom: 30px; }

        .input-group { margin-bottom: 20px; }
        label { display: block; font-size: 14px; color: #aaa; margin-bottom: 8px; }
        input, select { width: 100%; padding: 15px; background: rgba(0,0,0,0.5); border: 1px solid var(--border); border-radius: 12px; color: white; font-size: 16px; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(0, 229, 255, 0.2); }

        .color-picker { display: flex; gap: 10px; margin-top: 10px; }
        .color-opt { width: 35px; height: 35px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
        .color-opt.active { border-color: white; }

        /* Live Preview Window */
        .preview-window { position: sticky; top: 100px; height: 550px; background: #fff; border-radius: 30px; overflow: hidden; border: 8px solid #1a1a1a; box-shadow: 0 50px 100px rgba(0,0,0,0.6); }
        .preview-nav { padding: 15px; display: flex; justify-content: space-between; background: #fff; color: #000; border-bottom: 1px solid #eee; }
        .preview-hero { height: 250px; background: #f8f9fa; display: flex; align-items: center; justify-content: center; flex-direction: column; color: #000; text-align: center; padding: 20px; }
        .preview-products { padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .p-card { height: 100px; background: #eee; border-radius: 10px; }

        .launch-btn { background: var(--primary); color: #000; border: none; padding: 20px; border-radius: 15px; font-weight: 800; font-size: 18px; width: 100%; cursor: pointer; margin-top: 20px; transition: 0.3s; }
        .launch-btn:hover { transform: scale(1.02); background: #fff; }

    </style>
</head>
<body>

<nav>
    <div class="logo">VIRELIX PLATFORM</div>
    <div style="color: #888;">Partner Dashboard</div>
</nav>

<div class="container">
    <div class="creator-grid">
        <!-- Form Section -->
        <div class="setup-box">
            <h2>Start Your Business</h2>
            <p class="subtitle">ඔයාගේ Premium Dropshipping Store එක විනාඩියෙන් හදන්න.</p>

            <div class="input-group">
                <label>Store Name (ව්‍යාපාරයේ නම)</label>
                <input type="text" id="storeName" placeholder="Ex: Trendy Vibes" oninput="updatePreview()">
            </div>

            <div class="input-group">
                <label>Choose Store Theme Color</label>
                <div class="color-picker">
                    <div class="color-opt" style="background: #00e5ff;" onclick="setTheme('#00e5ff')"></div>
                    <div class="color-opt" style="background: #ff4081;" onclick="setTheme('#ff4081')"></div>
                    <div class="color-opt" style="background: #7c4dff;" onclick="setTheme('#7c4dff')"></div>
                    <div class="color-opt" style="background: #000000;" onclick="setTheme('#000000')"></div>
                </div>
            </div>

            <div class="input-group">
                <label>Niche / Category</label>
                <select id="category" onchange="updatePreview()">
                    <option value="Electronics">Electronics & Tech</option>
                    <option value="Fashion">Fashion & Apparel</option>
                    <option value="Beauty">Beauty & Cosmetics</option>
                </select>
            </div>

            <div class="input-group">
                <label>Store Slogan (ဆောင်පාඨය)</label>
                <input type="text" id="slogan" placeholder="Ex: Quality You Can Trust" oninput="updatePreview()">
            </div>

            <button class="launch-btn" onclick="launchStore()">LAUNCH MY STORE <i class="fa fa-rocket"></i></button>
        </div>

        <!-- Live Preview Section -->
        <div>
            <p style="text-align: center; color: #555; margin-bottom: 15px; font-weight: bold;">LIVE PREMIUM PREVIEW</p>
            <div class="preview-window" id="storePreview">
                <div class="preview-nav">
                    <b id="prevName">Your Store</b>
                    <div style="font-size: 12px;"><i class="fa fa-search"></i> <i class="fa fa-shopping-bag" style="margin-left:10px;"></i></div>
                </div>
                <div class="preview-hero" id="heroSection">
                    <h1 id="prevSlogan" style="font-size: 24px; margin: 0;">Quality You Can Trust</h1>
                    <button id="themeBtn" style="margin-top: 15px; padding: 8px 20px; border: none; border-radius: 5px; color: white; background: #000; font-size: 12px;">Shop Now</button>
                </div>
                <div class="preview-products">
                    <div class="p-card"></div>
                    <div class="p-card"></div>
                    <div class="p-card"></div>
                    <div class="p-card"></div>
                </div>
                <div style="text-align: center; color: #ccc; font-size: 10px; padding-bottom: 10px;">Powered by VIRELIX</div>
            </div>
        </div>
    </div>
</div>

<script>
    let currentTheme = "#00e5ff";

    function setTheme(color) {
        currentTheme = color;
        const hero = document.getElementById('heroSection');
        const btn = document.getElementById('themeBtn');
        
        hero.style.background = `linear-gradient(135deg, ${color}22, #ffffff)`;
        btn.style.backgroundColor = color;
        
        // Active color circle
        document.querySelectorAll('.color-opt').forEach(opt => {
            opt.classList.remove('active');
            if(opt.style.backgroundColor === hexToRgb(color)) opt.classList.add('active');
        });
    }

    function updatePreview() {
        const name = document.getElementById('storeName').value;
        const slogan = document.getElementById('slogan').value;
        
        document.getElementById('prevName').innerText = name || "Your Store";
        document.getElementById('prevSlogan').innerText = slogan || "Quality You Can Trust";
    }

    function launchStore() {
        const name = document.getElementById('storeName').value;
        if(!name) return alert("කරුණාකර ස්ටෝර් එකට නමක් දෙන්න!");

        alert(`🚀 සුබ පැතුම්! ඔබේ '${name}' ස්ටෝර් එක සාර්ථකව නිර්මාණය වුණා.`);
        // මෙතැනදී ඇත්තම ඩොමේන් එකකට යොමු කළ හැක
    }

    // Helper to match colors
    function hexToRgb(hex) {
        var result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? `rgb(${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)})` : null;
    }
</script>

</body>
</html>
